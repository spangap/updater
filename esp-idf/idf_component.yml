description: "updater: app-side staging + trigger for the single main-app + updater-partition firmware update model. Stages-and-triggers only; no flashing, no signature verification (deferred)."
url: https://github.com/spangap/updater
version: "0.1.0"
license: "Apache-2.0"
targets:
  - esp32s3
  - esp32p4
dependencies:
  idf:
    version: ">=5.5"
  # Cross-straddle deps are declared in straddle.yaml's `requires:` and staged
  # short-named via EXTRA_COMPONENT_DIRS at consumer-build time — not here, to
  # avoid double-staging under the manager's namespaced form.
